<ion-app>

  <ion-split-pane contentId="main">

    <ion-menu
      contentId="main"
      type="overlay"
      class="app-menu"
    >

      <!-- Cabeçalho do menu -->
      <ion-header>

        <ion-toolbar>

          <div class="menu-brand">

            <span class="brand-name">
              BERTOLDI
            </span>

            <span class="brand-subtitle">
              Advocacia
            </span>

          </div>

        </ion-toolbar>

      </ion-header>


      <!-- Navegação -->
      <ion-content>

        <div class="menu-content">

          <span class="menu-label">
            NAVEGAÇÃO
          </span>


          <nav class="navigation">

            <a
              class="navigation-item"
              [routerLink]="['/home']"
            >
              <span class="navigation-number">
                01
              </span>

              <span class="navigation-text">
                Documentos
              </span>

              <span class="navigation-arrow">
                →
              </span>
            </a>


            <a
              class="navigation-item"
              [routerLink]="['/adicionar']"
            >
              <span class="navigation-number">
                02
              </span>

              <span class="navigation-text">
                Adicionar documento
              </span>

              <span class="navigation-arrow">
                →
              </span>
            </a>

          </nav>


          <!-- Rodapé -->
          <div class="menu-footer">

            <div class="footer-line"></div>

            <span class="footer-title">
              GESTÃO DOCUMENTAL
            </span>

            <p>
              Sistema interno de gerenciamento
              de documentos.
            </p>

          </div>

        </div>

      </ion-content>

    </ion-menu>


    <ion-router-outlet id="main"></ion-router-outlet>

  </ion-split-pane>

</ion-app>
