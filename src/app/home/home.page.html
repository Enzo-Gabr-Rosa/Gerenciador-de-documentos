<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    
    <ion-title (click)="obterDocumentosAtivos()">
      Listagem de documentos
    </ion-title>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">
  @if (documentos.length === 0){
    <h1>Sem documentos</h1>
  } @else {

    <ion-grid>
      <ion-row>
        <ion-col><strong>ID</strong></ion-col>
        <ion-col><strong>Nome</strong></ion-col>
        <ion-col><strong>Criador</strong></ion-col>
        <ion-col><strong>Data</strong></ion-col>
        <ion-col><strong>Imagem</strong></ion-col>
        <ion-col><strong>Apagar</strong></ion-col>
      </ion-row>
      @for (doc of documentos; track doc.id){
          <ion-row>
            <ion-col>{{ doc.id }}</ion-col>
            <ion-col>{{ doc.nome }}</ion-col>
            <ion-col>{{ doc.criador }}</ion-col>
            <ion-col>{{ doc.dataCriacao }}</ion-col>
            <ion-col>Imagem</ion-col>
            <ion-col><ion-icon class="trash" name="trash-outline" (click)="apagarDocumento(doc.id)"></ion-icon></ion-col>
          </ion-row>
      }
    </ion-grid>
  }
  </ion-content>
